[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-lite"
version = "1.0.0"
description = "Local-first personal AI operating system for Windows 11"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "E501",  # line length handled by code style / long prompt strings
]

[tool.ruff.lint.isort]
known-first-party = [
    "ai", "api", "automation", "browser", "config", "core", "documents",
    "integrations", "intent", "maintenance", "memory", "orchestrator",
    "personalization", "proactive", "productivity", "security", "system",
    "tools", "vision", "voice"
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "voice.*"
ignore_errors = true
